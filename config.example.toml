[app]
name = "vllm-model-evaluation"
environment = "development"

[server]
host = "127.0.0.1"
port = 8000
log_level = "INFO"

[storage]
data_root = "./data"
database_url = "sqlite:///./data/evaluation.db"
task_bundle_root = "./data/task-bundles"
results_root = "./data/results"
exports_root = "./data/exports"

[runner]
type = "fake"
endpoint_url = ""
model_name = ""
auth_token_env = ""
timeout_seconds = 120.0
max_retries = 0
retry_backoff_seconds = 0.0
concurrency = 1
warmup_count = 0
streaming = true
